name: Home runner smoke

# Proves the home Kubernetes runner (docs/ci-home-runner.md) can carry the full
# gate before ci.yml's full tier is pointed at it. Manual dispatch from main only.
on:
  workflow_dispatch:
    inputs:
      playwright_grep:
        description: Optional. Also run browser tests matching this title, five times per engine, and upload their traces
        required: false
        default: ""
        type: string
      playwright_project:
        description: Engine for playwright_grep
        required: false
        default: webkit
        type: choice
        options:
          - chromium
          - firefox
          - webkit

permissions:
  contents: read

jobs:
  smoke:
    name: Home runner smoke
    if: github.ref == 'refs/heads/main'
    runs-on: artifact-server-home
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No service-account token is mounted
        run: test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
      - name: Docker uses the containerd image store
        run: docker info --format '{{json .DriverStatus}}' | grep -F 'io.containerd.snapshotter.v1'
      - name: Prepare the home runner
        run: scripts/prepare-home-runner.sh
      - name: Tools the full gate takes from the runner are present
        run: |
          missing=()
          for tool in curl git jq openssl sudo unzip; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          docker compose version >/dev/null 2>&1 || missing+=("docker compose")
          docker buildx version >/dev/null 2>&1 || missing+=("docker buildx")
          if (( ${#missing[@]} )); then
            printf 'Missing on the home runner: %s\n' "${missing[@]}"
            exit 1
          fi
      - name: kind creates and deletes a cluster inside Docker-in-Docker
        run: |
          scripts/with-kubernetes-test-tools.sh bash -c \
            'kind create cluster --name home-smoke --retain --wait 120s && kind delete cluster --name home-smoke'
      - name: Diagnose a failed kind cluster
        if: failure()
        run: |
          echo "== inotify limits (shared with the node)"
          sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches || true
          echo "== cgroup"
          stat -fc %T /sys/fs/cgroup || true
          node=home-smoke-control-plane
          echo "== containerd (inside the kind node)"
          docker exec "$node" journalctl -u containerd --no-pager 2>&1 | grep -iE "cri|plugin|error|fail|warn" | tail -40 || true
          echo "== node containers"
          docker exec "$node" crictl ps -a 2>&1 | tail -20 || true
          echo "== kubelet"
          docker exec "$node" journalctl -u kubelet --no-pager 2>&1 | grep -iE "error|fail|too many|cgroup" | tail -40 || true
          echo "== kube-apiserver"
          docker exec "$node" sh -c 'crictl logs --tail 40 $(crictl ps -a --name kube-apiserver -q | head -1)' 2>&1 | tail -40 || true
          echo "== etcd"
          docker exec "$node" sh -c 'crictl logs --tail 20 $(crictl ps -a --name etcd -q | head -1)' 2>&1 | tail -20 || true
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.3
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Subdomains of localhost resolve to loopback for Node
        run: node -e "require('node:dns').lookup('home-runner-check.localhost', (error, address) => { if (error) throw error; console.log(address); })"
      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
      - name: Ruby runs with a UTF-8 default encoding
        run: ruby -e 'puts RUBY_VERSION; exit(Encoding.default_external == Encoding::UTF_8)'
      - name: Playwright system dependencies install
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run the requested browser tests
        if: inputs.playwright_grep != ''
        env:
          BROWSER_CRITICAL_ENGINES: all
          PLAYWRIGHT_GREP: ${{ inputs.playwright_grep }}
          PLAYWRIGHT_PROJECT: ${{ inputs.playwright_project }}
        run: |
          pnpm exec playwright install --with-deps "$PLAYWRIGHT_PROJECT"
          pnpm build
          pnpm exec playwright test --grep "$PLAYWRIGHT_GREP" --project "$PLAYWRIGHT_PROJECT" \
            --repeat-each 5 --trace on --reporter line
      - name: Upload browser traces
        if: ${{ !cancelled() && inputs.playwright_grep != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-runner-browser-traces-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

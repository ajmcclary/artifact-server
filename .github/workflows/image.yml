name: image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: artifact-server-home
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The self-hosted runner holds packages: write; leave no token in
          # .git/config for later steps or a persistent workspace to reuse.
          persist-credentials: false

      - name: Prepare the home runner
        run: scripts/prepare-home-runner.sh

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # BuildKit itself would otherwise come from Docker Hub. The digest is
          # the one ci.yml and release.yml pin, not the moving buildx-stable-1.
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packaging/oci/Dockerfile
          push: true
          tags: ghcr.io/ajmcclary/artifact-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Docker Hub rate-limits and has outages for shared runner IPs; the
          # same digest-pinned frontend and base come byte-identical from
          # Google's mirror.
          build-args: |
            BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile:1.18@sha256:dabfc0969b935b2080555ace70ee69a5261af8a8f1b4df97b9e7fbcf6722eddf
            NODE_IMAGE=mirror.gcr.io/library/node:24.15.0-bookworm-slim@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/ajmcclary/artifact-server
            IMAGE_VERSION=0.1.4

      - name: Print digest
        run: echo "digest=${{ steps.build.outputs.digest }}"

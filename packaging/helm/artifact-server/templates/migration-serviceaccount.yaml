{{- include "artifact-server.validation" . -}}
{{- if .Values.migration.enabled }}
# The migration Job is a pre-install hook, so it runs before any ordinary
# release resource, including the chart ServiceAccount, exists. This account is
# created as an earlier hook so the Job never falls back to the namespace
# default account. It holds no API token and no role binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "artifact-server.migrationServiceAccountName" . }}
  labels:
    {{- include "artifact-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
{{- end }}
